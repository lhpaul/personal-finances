# CodeRabbit configuration
#
# This file controls CodeRabbit's behavior for this repository.
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# This repository is configured for GitHub App PR reviewer mode:
# - auto PR reviews are enabled for non-draft PRs targeting develop
# - pr-review-loop.sh treats "coderabbit" in review.on_ready.github as the
#   durable ready-phase reviewer signal
# - draft PR reviews remain disabled so the workflow's draft gates run first

reviews:
  tools:
    github-checks:
      enabled: true
      timeout_ms: 600000
  auto_review:
    # Label-gated. CodeRabbit exhausted its included quota on 2026-08-01 (95th
    # percentile of review volume), throttling to one included review every ~40
    # minutes. Rather than pay that stall on every PR, reviews are now opt-in:
    # only PRs carrying `needs-coderabbit` are reviewed automatically.
    #
    # Apply the label to:
    #   - implementation PRs (feature/*, fix/*, refactor/*)
    #   - any Feature-route item: #3 schema, #6 scraper, #9 credentials,
    #     #10 sync, #13 categorization
    # Plan and spec PRs for mechanical items do not need it.
    #
    # `@coderabbitai review` still triggers a manual pass on any PR.
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 1
    labels:
      - needs-coderabbit
    base_branches:
      - develop
  path_filters:
    - "!dist/**"
    - "!**/*.generated.*"
    - "!**/*.lock"
    - "!**/node_modules/**"
  profile: "assertive"
  # Scope restriction: restrict CodeRabbit's review to files in the PR diff.
  # When set to true, CodeRabbit only comments on files that appear in the PR's
  # changed files list. It will not expand its review to files outside the diff
  # (e.g., tangentially related documentation or config files).
  # This prevents scope inflation where CodeRabbit flags unrelated files and
  # causes agents to make unintended edits that increase PR diff size and risk.
  changed_files_only: true
  path_instructions:
    - path: "**/*.sh"
      instructions: "Do not report on docstring coverage. Bash and shell scripts have no formal docstring standard; skip any docstring-coverage warnings for these files."
