name: Markdown Lint

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'docs/specs/developments/**'
      - 'docs/testing/workflow/**'
      - 'CHANGELOG.md'
      - '.markdownlint.jsonc'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/lint/markdown-heuristic-lint.py'
      - 'scripts/lint/check-changelog-duplicate-headers.sh'

jobs:
  markdown-lint:
    name: Markdown lint (spec/plan/CHANGELOG)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect target markdown files
        id: collect
        run: |
          mapfile -d '' -t md_files < <(
            find docs/specs/developments docs/testing/workflow -type f -name "*.md" -print0 2>/dev/null
          )
          if [ -f CHANGELOG.md ]; then
            md_files+=("CHANGELOG.md")
          fi
          if [ "${#md_files[@]}" -eq 0 ]; then
            echo "No target markdown files found — skipping lint."
            echo "found_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "found_files=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#md_files[@]} markdown file(s) to lint:"
            printf '  %s\n' "${md_files[@]}"
          fi

      - name: Run markdownlint-cli2
        if: steps.collect.outputs.found_files == 'true'
        run: |
          ./node_modules/.bin/markdownlint-cli2 \
            "docs/specs/developments/**/*.md" \
            "docs/testing/workflow/**/*.md" \
            "CHANGELOG.md"

      - name: Run heuristic lint checks (GLOB001, COUNT001)
        if: steps.collect.outputs.found_files == 'true'
        run: |
          mapfile -d '' -t md_files < <(
            find docs/specs/developments docs/testing/workflow -type f -name "*.md" -print0 2>/dev/null
          )
          if [ -f CHANGELOG.md ]; then
            md_files+=("CHANGELOG.md")
          fi
          python3 scripts/lint/markdown-heuristic-lint.py "${md_files[@]}"

      - name: Check CHANGELOG for duplicate section headers
        run: bash scripts/lint/check-changelog-duplicate-headers.sh CHANGELOG.md
