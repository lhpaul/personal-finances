name: E2E / Regression Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches:
      - develop
      - main

concurrency:
  group: e2e-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E regression (placeholder)
    if: >-
      vars.ENABLE_TEMPLATE_PLACEHOLDER_REGRESSION == 'true' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'ready-for-regression') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ready-for-regression'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

  maestro-ios:
    name: Maestro E2E (iOS simulator)
    # Doubly gated (implementation plan for issue #22, D14): the ready-for-regression label AND
    # an opt-in repository variable, because macOS runners are billed at a multiple of Linux
    # minutes — the same "declared but inert until the owner opts in" pattern
    # vars.ENABLE_TEMPLATE_PLACEHOLDER_REGRESSION already uses above. With the variable unset,
    # this job never starts and bills nothing (Owner decision required, plan section).
    if: >-
      vars.ENABLE_MAESTRO_E2E == 'true' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'ready-for-regression') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ready-for-regression'))
      )
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check node_modules layout
        run: pnpm check:layout

      - name: Validate flow contract and flow lint
        run: |
          pnpm e2e:contract
          pnpm e2e:lint

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Create and boot the Finanzas E2E simulator
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes | awk '/iOS/ {print $NF}' | tail -1)"
          xcrun simctl create "Finanzas E2E" "iPhone 16" "$RUNTIME_ID"
          xcrun simctl boot "Finanzas E2E"

      - name: Prebuild the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
        env:
          APP_VARIANT: development

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Build and install the Debug app
        working-directory: apps/mobile
        run: npx expo run:ios --device "Finanzas E2E" --no-install --no-bundler
        env:
          APP_VARIANT: development

      - name: Start Metro and wait for it to be ready
        working-directory: apps/mobile
        run: |
          nohup npx expo start > /tmp/metro.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s http://localhost:8081/status | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 2
          done
          echo "Metro did not become ready in time" >&2
          cat /tmp/metro.log >&2
          exit 1

      - name: Run Maestro suite
        run: bash scripts/e2e/run-e2e.sh

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-debug-output
          path: .tmp/e2e
