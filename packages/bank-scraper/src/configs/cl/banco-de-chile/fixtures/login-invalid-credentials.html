<!DOCTYPE html>
<!--
  Hand-authored fixture, not captured from a live session (Documented Deviation D3). See
  fixtures/README.md for provenance. Same form as login.html, plus a visible rejection banner so
  the "no bank text attached" assertion (AC14) has something real to not attach.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Banco de Chile - Ingresar</title>
  </head>
  <body>
    <main class="login-form">
      <h1>Ingresa a tu Banco en línea</h1>
      <div role="alert">Los datos ingresados no son correctos. Por favor, inténtalo nuevamente.</div>
      <form id="ppriv_per-login-click-form">
        <label for="ppriv_per-login-click-input-rut">RUT</label>
        <input id="ppriv_per-login-click-input-rut" type="text" placeholder="12.345.678-9" />
        <label for="ppriv_per-login-click-input-password">Clave</label>
        <input id="ppriv_per-login-click-input-password" type="password" />
        <button id="ppriv_per-login-click-ingresar-login" type="button">Ingresar</button>
      </form>
    </main>
  </body>
</html>
